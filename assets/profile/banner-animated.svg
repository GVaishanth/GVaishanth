<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="G. VAISHANTH | Local-first web apps · Interactive front-ends · Mobile tools">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .rm{display:none}
      .bar{transform-origin:83px 92px;animation:barIn .8s ease-out both}
      @keyframes barIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
      .fadeUp{opacity:0;animation:fadeUp .7s ease-out .1s forwards}
      @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      .dot{animation:dot 1.6s ease-in-out infinite}
      @keyframes dot{0%,100%{opacity:.35}50%{opacity:1}}
      .sheen{animation:sheen 14s linear infinite}
      @keyframes sheen{from{transform:translateX(0)}to{transform:translateX(1540px)}}
      @media (prefers-reduced-motion:reduce){
        *{animation:none!important}
        .anim{display:none}
        .rm{display:block}
        .fadeUp{opacity:1}
      }
    </style>
  </defs>

  <rect width="1280" height="360" fill="#0d1117"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect class="sheen" x="-260" y="0" width="260" height="360" fill="url(#sheen)"/>

  <!-- status -->
  <text x="1200" y="62" text-anchor="end" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">building in public</text>
  <circle class="dot" cx="1015" cy="56" r="6" fill="#3fb950"/>

  <!-- accent bar + identity -->
  <rect class="bar" x="80" y="92" width="6" height="140" fill="#3fb950"/>
