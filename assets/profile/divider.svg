<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="12" viewBox="0 0 1280 12" role="img" aria-label="section divider">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3fb950" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <style>
      .p{animation:sweep 8s linear infinite}
      @keyframes sweep{from{transform:translateX(-140px)}to{transform:translateX(1280px)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect x="0" y="5" width="1280" height="2" fill="#21262d"/>
  <rect class="p" x="0" y="5" width="140" height="2" fill="url(#pulse)"/>
</svg>
